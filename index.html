<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - Fast & Free</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<div class="max-w-2xl mx-auto p-4">
<h1 class="text-3xl font-bold text-center mt-8">Image Compressor 🚀</h1>
<p class="text-zinc-400 text-center mt-2 mb-6">Bulk Upload | Quality Control | ZIP Download</p>

<div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5">
<input type="file" id="fileInput" multiple accept="image/*" class="w-full file:bg-white file:text-black file:font-bold file:rounded-full file:px-4 file:py-2 file:border-0 bg-zinc-800 rounded-xl p-2">

<div class="grid grid-cols-2 gap-4 mt-5">
<div class="bg-zinc-800 p-3 rounded-xl">
<label class="text-sm text-zinc-400">Quality: <b id="qText" class="text-white">80%</b></label>
<input type="range" id="quality" min="10" max="100" value="80" class="w-full accent-white mt-2">
</div>
<div class="bg-zinc-800 p-3 rounded-xl">
<label class="text-sm text-zinc-400">Format</label>
<select id="format" class="w-full bg-transparent text-white mt-1 outline-none">
<option value="image/webp" class="text-black">WEBP - Best</option>
<option value="image/jpeg" class="text-black">JPEG</option>
<option value="image/png" class="text-black">PNG</option>
</select>
</div>
</div>

<button id="zipBtn" class="hidden w-full mt-5 bg-white text-black font-bold py-3 rounded-full">Download All as ZIP</button>
<div id="list" class="mt-6 space-y-3"></div>
</div>
<p class="text-center text-zinc-600 text-xs mt-4">Made by Eshwar0000 • Hosted on GitHub</p>
</div>

<script>
const input=document.getElementById('fileInput'), qual=document.getElementById('quality'), qText=document.getElementById('qText'), fmt=document.getElementById('format'), list=document.getElementById('list'), zipBtn=document.getElementById('zipBtn');
let filesData=[];
qual.oninput=()=>qText.textContent=qual.value+'%';
input.onchange=async(e)=>{
  list.innerHTML=''; filesData=[]; zipBtn.classList.add('hidden');
  for(const file of e.target.files){
    const row=document.createElement('div');
    row.className='flex items-center gap-3 bg-zinc-800 p-3 rounded-2xl';
    row.innerHTML=`<img class="w-16 h-16 rounded-xl object-cover bg-zinc-700"><div class="flex-1 min-w-0"><p class="text-sm truncate">${file.name}</p><p class="text-xs text-zinc-400">${(file.size/1024).toFixed(0)} KB → <span class="new text-green-400">...</span></p></div><a class="bg-white text-black text-xs font-bold px-3 py-2 rounded-full">DL</a>`;
    list.appendChild(row);
    const imgTag=row.querySelector('img'), newTag=row.querySelector('.new'), aTag=row.querySelector('a');
    const img=new Image(); img.src=URL.createObjectURL(file);
    await new Promise(r=>img.onload=r);
    const canvas=document.createElement('canvas'); canvas.width=img.width; canvas.height=img.height;
    canvas.getContext('2d').drawImage(img,0,0);
    const blob=await new Promise(r=>canvas.toBlob(r, fmt.value, qual.value/100));
    const url=URL.createObjectURL(blob);
    imgTag.src=url; newTag.textContent=(blob.size/1024).toFixed(0)+' KB';
    aTag.href=url; aTag.download='compressed-'+file.name.split('.')[0]+'.'+fmt.value.split('/')[1];
    filesData.push({name:aTag.download, blob});
    if(filesData.length>1) zipBtn.classList.remove('hidden');
  }
};
zipBtn.onclick=async()=>{
  const zip=new JSZip();
  filesData.forEach(f=>zip.file(f.name,f.blob));
  const content=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='compressed-images.zip'; a.click();
};
</script>
</body>
</html>
