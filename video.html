<!DOCTYPE html>
<html lang="en">

<title>Video Compressor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;padding:15px}
.container{max-width:500px;margin:auto}
h1{text-align:center;margin:20px 0;font-size:26px}

.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:18px;margin:15px 0}

video{width:100%;border-radius:10px;background:#000;margin:10px 0}
select{width:100%;padding:12px;background:#222;border:1px solid #444;border-radius:8px;color:#fff;margin:8px 0}
.btn{width:100%;padding:14px;background:#a855f7;border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:16px}
#log{background:#111;padding:8px;border-radius:6px;font-size:11px;color:#0f0;height:80px;overflow:auto;margin-top:10px}
.info{font-size:13px;color:#aaa;display:flex;justify-content:space-between;margin:5px 0}
</style>
</head>

</div>
<video id="preview" controls hidden></video>
