<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:black; color:white; text-align:center; font-family:sans-serif; margin:0; padding:15px;}
.card{background:#111; border-radius:15px; padding:15px; max-width:400px; margin:auto; border:1px solid #333;}
img{width:100%; border-radius:12px; margin-top:10px;}
h2{color:#ff3333;}
p{font-size:18px; line-height:1.6;}
</style>
</head>
<body>
<div class="card">
<h2>ರಾತ್ರಿ 12 ಗಂಟೆಯ ಕೊನೆಯ ಬಸ್</h2>
<img src="https://images.unsplash.com/photo-1519003722824-194243704534?w=600">
<p>ರಾತ್ರಿ 12 ಗಂಟೆ, ರಮ್ಯಾ ಕೊನೆಯ ಬಸ್ ಗಾಗಿ ಒಬ್ಬಳೇ ಕಾಯ್ತಿದ್ದಳು...</p>
<img src="https://images.unsplash.com/photo-1494783367193-149034c05e8f?w=600">
<p>ಇದ್ದಕ್ಕಿದ್ದಂತೆ ಡ್ರೈವರ್ ಇಲ್ಲದ ಒಂದು ಖಾಲಿ ಬಸ್ ಬಂತು. ಅವಳು ಭಯದಲ್ಲೇ ಹತ್ತಿದಳು.</p>
<img src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=600">
<p><b>ಬಸ್ ಒಳಗೆ ನೋಡಿದರೆ ಎಲ್ಲರೂ ದೆವ್ವಗಳು! ಇದು ಮನುಷ್ಯರ ಬಸ್ ಅಲ್ಲ!</b></p>
<p style="color:yellow;">ನೀತಿ: ರಾತ್ರಿ ಅಪರಿಚಿತ ವಾಹನ ಹತ್ತಬೇಡಿ!</p>
</div>
</body>
</html>
